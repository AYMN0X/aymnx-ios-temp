name: Build iOS (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned AYMNX.ipa
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project (skip auto-install; pods handled next)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          set -euxo pipefail
          cd ios
          pod install

      - name: Archive .app with xcodebuild (no code signing)
        run: |
          set -euxo pipefail
          cd ios
          xcodebuild archive \
            -workspace *.xcworkspace \
            -scheme AYMNX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/AYMNX.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned .ipa
        run: |
          set -euxo pipefail
          mkdir -p Payload
          cp -r "$GITHUB_WORKSPACE/build/AYMNX.xcarchive/Products/Applications/"*.app Payload/
          zip -r AYMNX.ipa Payload
          rm -rf Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AYMNX-unsigned
          path: AYMNX.ipa
          if-no-files-found: error