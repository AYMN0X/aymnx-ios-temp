name: Build iOS (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned SpotifyWhite.ipa
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project (skip auto-install; pods handled next)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          set -euxo pipefail
          cd ios
          pod install

      - name: Resolve workspace and scheme
        id: resolve
        run: |
          set -euxo pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error::No .xcworkspace found after prebuild" && exit 1
          fi
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | awk 'f && NF {print $1; exit} /^[[:space:]]*Schemes:/ {f=1}')
          if [ -z "$SCHEME" ]; then
            SCHEME=$(find . -name "*.xcscheme" -path "*/xcshareddata/*" \
              -exec basename {} .xcscheme \; | head -n 1)
          fi
          if [ -z "$SCHEME" ]; then
            echo "::error::Could not resolve an Xcode scheme" && exit 1
          fi
          echo "workspace=$WORKSPACE"
          echo "scheme=$SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build .app with xcodebuild (no code signing)
        run: |
          set -euxo pipefail
          cd ios
          xcodebuild \
            -workspace "${{ steps.resolve.outputs.workspace }}" \
            -scheme "${{ steps.resolve.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CONFIGURATION_BUILD_DIR=build/output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -euxo pipefail
          mkdir -p Payload
          APP_PATH=$(find ios/build -maxdepth 5 -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found anywhere in ios/build"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r SpotifyWhite.ipa Payload
          rm -rf Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyWhite-unsigned
          path: SpotifyWhite.ipa
          if-no-files-found: error